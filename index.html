<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parte la Noche</title>
    <link rel="icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #008080;
            --accent: #f9c846;
            --bg: #f4f8fb;
            --card-bg: #fff;
            --text: #222;
            --header: #005a5a;
            --button: #008080;
            --button-hover: #005a5a;
            --button-text: #fff;
            --shift-bg: #e6f7fa;
            --shift-border: #b2dfdb;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 8px 0 8px;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .header-icon {
            font-size: 2.2em;
            color: var(--primary);
        }
        h1 {
            color: var(--header);
            font-size: 1.7em;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.01em;
        }
        .params {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.06);
            padding: 18px 14px 10px 14px;
            margin-bottom: 18px;
            width: 100%;
        }
        .params-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .params-row:last-child { margin-bottom: 0; }
        .params-label {
            font-weight: 500;
            color: var(--primary);
        }
        .btn {
            background: var(--button);
            color: var(--button-text);
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            outline: none;
        }
        .btn:active, .btn:focus, .btn:hover {
            background: var(--button-hover);
        }
        .btn-small {
            padding: 4px 10px;
            font-size: 0.95em;
        }
        .shift-card {
            background: var(--shift-bg);
            border: 1px solid var(--shift-border);
            border-radius: 12px;
            margin: 10px 0;
            padding: 12px 10px 8px 10px;
            box-shadow: 0 1px 4px 0 rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 320px;
            max-width: 600px;
            width: 90vw;
        }
        .shift-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
        }
        .shift-duration {
            font-size: 0.98em;
            color: #00796b;
            margin-bottom: 2px;
        }
        .shift-time {
            font-size: 1.1em;
            color: var(--accent);
            font-weight: 500;
        }
        .time {
            font-size: 1.2em;
            color: var(--primary);
            margin: 8px 0 0 0;
        }
        .footer {
            color: #888;
            font-size: 0.98em;
            margin: 30px 0 10px 0;
            text-align: center;
        }
        a { color: var(--primary); text-decoration: underline; }
        .residente-name {
            color: #8B4513; /* SaddleBrown, goes well with teal and medical palette */
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        @media (max-width: 600px) {
            .container {
                padding: 12px 2vw 0 2vw;
                max-width: 100vw;
            }
            .params {
                padding: 12px 4vw 8px 4vw;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo" style="height:54px;width:auto;margin-right:16px;vertical-align:middle;border-radius:8px;background:transparent;opacity:0.92;" />
        <h1>Parte la Noche</h1>
    </div>
    <div class="params">
        <div class="params-row">
            <button class="btn btn-small" id="dec-initial">&lt;</button>
            <span class="params-label">desde</span>
            <span id="initial-hour"></span>
            <button class="btn btn-small" id="inc-initial">&gt;</button>
            <button class="btn btn-small" id="now">ahora</button>
        </div>
        <div class="params-row">
            <button class="btn btn-small" id="dec-target">&lt;</button>
            <span class="params-label">hasta</span>
            <span id="target-hour"></span>
            <button class="btn btn-small" id="inc-target">&gt;</button>
        </div>
        <div class="params-row">
            <button class="btn btn-small" id="dec-shift">-</button>
            <span id="current-shifts"></span> <span class="params-label">turnos</span>
            <button class="btn btn-small" id="inc-shift">+</button>
            <button class="btn btn-small" id="names-btn">residentes</button>
        </div>
        <div class="params-row">
            <span id="total-time"></span>
        </div>
    </div>
    <div class="time" id="initial-time"></div>
    <div id="shifts"></div>
    <div style="margin:18px 0;">
        <button class="btn" id="recalc">Recalcular</button>
    </div>
    <div id="marker" style="position: absolute; left: 0; right: 0; pointer-events: none;"></div>
</div>
<div class="footer">
    Hecho con cariño ♥ para los residentes de COT del Hospital Clínic de Barcelona.<br>
    Contacta: <a href="mailto:lezkafree+partelanoche@gmail.com">Lezka</a>
</div>
<div id="names-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);z-index:100;justify-content:center;align-items:center;">
  <div style="background:#fff;padding:24px 18px 18px 18px;border-radius:16px;box-shadow:0 2px 12px 0 rgba(0,0,0,0.12);min-width:320px;max-width:90vw;">
    <h2 style="margin-top:0;font-size:1.2em;color:#00796b;text-align:center;">Asignar nombres a los turnos</h2>
    <form id="names-form">
      <!-- Shift name inputs will be injected here -->
    </form>
    <div style="text-align:center;margin-top:18px;">
      <button type="button" class="btn" id="names-save">Guardar</button>
      <button type="button" class="btn" id="names-clear">Quitar nombres</button>
      <button type="button" class="btn" id="names-cancel">Cerrar</button>
    </div>
  </div>
</div>
<script>
// --- State ---
let numShifts = 2;
let targetHour = 8, targetMinutes = 0;
let initialHour = 22, initialMinutes = 0;
let referenceTime = createDate(initialHour, initialMinutes); // Always static
const MIN_TARGET = 5, MAX_TARGET = 11;
let shiftNames = Array(numShifts).fill("");

// --- Functions ---
function pad(n) { return n.toString().padStart(2, '0'); }
function formatTime(h, m) { return `${pad(h)}:${pad(m)} h`; }
function formatNow() {
    const d = new Date();
    return `${pad(d.getHours())}:${pad(d.getMinutes())} h`;
}
function convertMs(ms) {
    const h = Math.floor(ms / 36e5), m = Math.floor((ms % 36e5) / 6e4);
    if (m > 0) {
        return `${h} horas ${pad(m)} minutos`;
    } else {
        return `${h} horas`;
    }
}
function createDate(h, m) {
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
}
function msToTarget() {
    const start = referenceTime;
    let h = targetHour - start.getHours();
    let m = targetMinutes - start.getMinutes();
    if (h < 0 || (h === 0 && m < 0)) h += 24;
    return h * 3600000 + m * 60000;
}
function calcShifts() {
    const msTotal = msToTarget();
    const msPer = msTotal / numShifts;
    let ms = referenceTime.getTime();
    let html = '';
    for (let i = 1; i <= numShifts; i++) {
        ms += msPer;
        const d = new Date(ms);
        html += `<div class='shift-card'><div class='shift-title'>Turno ${i}${shiftNames[i-1] ? ` — <span class='residente-name'>${shiftNames[i-1]}</span>` : ''}</div><div class='shift-duration'>${convertMs(msPer)}</div></div>`;
        html += `<div class='shift-end-label' style="text-align:center;margin-bottom:10px;font-size:1.15em;color:#00796b;font-weight:400;letter-spacing:0.01em;">${pad(d.getHours())}:${pad(d.getMinutes())} h</div>`;
    }
    document.getElementById('shifts').innerHTML = html;
    document.getElementById('total-time').textContent = 'Tiempo a partir: ' + convertMs(msTotal);
}
function getShiftRanges() {
    const msTotal = msToTarget();
    const msPer = msTotal / numShifts;
    let ms = referenceTime.getTime();
    let ranges = [];
    for (let i = 1; i <= numShifts; i++) {
        let start = ms;
        ms += msPer;
        let end = ms;
        ranges.push({start, end, idx: i});
    }
    return ranges;
}
function updateMarker() {
    // Remove any existing marker
    const oldMarkers = document.querySelectorAll('#shift-marker, #pre-shift-marker');
    oldMarkers.forEach(m => m.remove());
    const now = Date.now();
    const ranges = getShiftRanges();
    const shiftsDiv = document.getElementById('shifts');
    const shiftCards = Array.from(shiftsDiv.querySelectorAll('.shift-card'));
    // If before the first shift, show marker between general panel and shifts
    if (now < ranges[0].start) {
        let container = document.querySelector('.container');
        let marker = document.createElement('div');
        marker.id = 'pre-shift-marker';
        marker.style.position = 'relative';
        marker.style.left = '50%';
        marker.style.transform = 'translateX(-50%)';
        marker.style.width = 'min(700px, 98vw)';
        marker.style.height = '5px';
        marker.style.background = 'rgba(255,0,0,0.35)';
        marker.style.zIndex = 30;
        marker.style.borderRadius = '3px';
        marker.style.display = 'flex';
        marker.style.alignItems = 'center';
        marker.style.margin = '18px auto 18px auto';
        marker.style.pointerEvents = 'none';
        // Left label: before shifts
        const leftLabel = document.createElement('span');
        leftLabel.textContent = `Antes de partir`;
        leftLabel.style.marginLeft = '0';
        leftLabel.style.background = 'rgba(255,255,255,0.95)';
        leftLabel.style.color = '#00796b';
        leftLabel.style.fontWeight = 'bold';
        leftLabel.style.fontSize = '1em';
        leftLabel.style.padding = '1px 8px';
        leftLabel.style.borderRadius = '8px';
        leftLabel.style.boxShadow = '0 1px 4px 0 rgba(0,0,0,0.07)';
        // Live timer (current time) after left label
        const timerLabel = document.createElement('span');
        timerLabel.style.marginLeft = '10px';
        timerLabel.style.background = 'rgba(255,255,255,0.95)';
        timerLabel.style.color = '#b71c1c';
        timerLabel.style.fontSize = '1em';
        timerLabel.style.fontWeight = 'bold';
        timerLabel.style.padding = '1px 8px';
        timerLabel.style.borderRadius = '8px';
        timerLabel.style.boxShadow = '0 1px 4px 0 rgba(0,0,0,0.07)';
        const d = new Date(now);
        timerLabel.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        marker.appendChild(leftLabel);
        marker.appendChild(timerLabel);
        // Insert marker after the configuration box (params)
        const paramsBox = document.querySelector('.params');
        if (paramsBox && paramsBox.parentNode) {
            paramsBox.parentNode.insertBefore(marker, paramsBox.nextSibling);
        }
        return;
    }
    // Marker for current/active shift
    for (let i = 0; i < ranges.length; i++) {
        const card = shiftCards[i];
        if (!card) continue;
        let percent = 0;
        if (now < ranges[i].start) {
            percent = 0;
        } else if (now > ranges[i].end) {
            percent = 1;
        } else {
            percent = (now - ranges[i].start) / (ranges[i].end - ranges[i].start);
        }
        const marker = document.createElement('div');
        marker.id = 'shift-marker';
        marker.style.position = 'absolute';
        marker.style.left = '50%';
        marker.style.transform = 'translateX(-50%)';
        marker.style.width = 'min(700px, 98vw)'; // Wider marker if space allows
        marker.style.height = '5px';
        marker.style.background = 'rgba(255,0,0,0.35)';
        marker.style.zIndex = 30;
        marker.style.borderRadius = '3px';
        marker.style.display = 'flex';
        marker.style.alignItems = 'center';
        marker.style.pointerEvents = 'none';
        card.style.position = 'relative';
        marker.style.top = (card.clientHeight * percent) + 'px';
        // Left label: current shift and doctor name
        const leftLabel = document.createElement('span');
        leftLabel.innerHTML = `Turno ${i+1}${shiftNames[i] ? ` — <span class='residente-name'>${shiftNames[i]}</span>` : ''}`;
        leftLabel.style.marginLeft = '0';
        leftLabel.style.background = 'rgba(255,255,255,0.95)';
        leftLabel.style.color = '#00796b';
        leftLabel.style.fontWeight = 'bold';
        leftLabel.style.fontSize = '1em';
        leftLabel.style.padding = '1px 8px';
        leftLabel.style.borderRadius = '8px';
        leftLabel.style.boxShadow = '0 1px 4px 0 rgba(0,0,0,0.07)';
        // Live timer (current time) after left label
        const timerLabel = document.createElement('span');
        timerLabel.style.marginLeft = '10px';
        timerLabel.style.background = 'rgba(255,255,255,0.95)';
        timerLabel.style.color = '#b71c1c';
        timerLabel.style.fontSize = '1em';
        timerLabel.style.fontWeight = 'bold';
        timerLabel.style.padding = '1px 8px';
        timerLabel.style.borderRadius = '8px';
        timerLabel.style.boxShadow = '0 1px 4px 0 rgba(0,0,0,0.07)';
        const d = new Date(now);
        timerLabel.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        // Countdown label (time left in shift) at far right
        const countdownLabel = document.createElement('span');
        countdownLabel.style.marginLeft = 'auto';
        countdownLabel.style.background = 'rgba(255,255,255,0.95)';
        countdownLabel.style.color = '#00796b';
        countdownLabel.style.fontSize = '1em';
        countdownLabel.style.fontWeight = 'bold';
        countdownLabel.style.padding = '1px 8px';
        countdownLabel.style.borderRadius = '8px';
        countdownLabel.style.boxShadow = '0 1px 4px 0 rgba(0,0,0,0.07)';
        // Calculate time left in shift
        let msLeft = Math.max(0, ranges[i].end - now);
        let hLeft = Math.floor(msLeft / 3600000);
        let mLeft = Math.floor((msLeft % 3600000) / 60000);
        let sLeft = Math.floor((msLeft % 60000) / 1000);
        let leftText = hLeft > 0 ? `${hLeft}h ` : '';
        leftText += mLeft > 0 ? `${mLeft}m ` : '';
        leftText += `${sLeft}s`;
        countdownLabel.textContent = leftText.trim();
        marker.appendChild(leftLabel);
        marker.appendChild(timerLabel);
        marker.appendChild(countdownLabel);
        if (now >= ranges[i].start && now <= ranges[i].end) {
            card.appendChild(marker);
            break;
        }
        if (i === 0 && now < ranges[0].start) {
            card.appendChild(marker);
            break;
        }
        if (i === ranges.length - 1 && now > ranges[ranges.length - 1].end) {
            card.appendChild(marker);
            break;
        }
    }
}
function updateUI() {
    document.getElementById('initial-hour').innerHTML = `${pad(referenceTime.getHours())}:${pad(referenceTime.getMinutes())} h`;
    document.getElementById('initial-time').textContent = `${pad(referenceTime.getHours())}:${pad(referenceTime.getMinutes())} h`;
    document.getElementById('target-hour').textContent = formatTime(targetHour, targetMinutes);
    document.getElementById('current-shifts').textContent = numShifts;
    calcShifts();
    setTimeout(updateMarker, 10);
}

// --- State ---
function saveState() {
    localStorage.setItem('pln_initialHour', initialHour);
    localStorage.setItem('pln_initialMinutes', initialMinutes);
    localStorage.setItem('pln_targetHour', targetHour);
    localStorage.setItem('pln_targetMinutes', targetMinutes);
    localStorage.setItem('pln_numShifts', numShifts);
    localStorage.setItem('pln_shiftNames', JSON.stringify(shiftNames));
}
function loadState() {
    const ih = localStorage.getItem('pln_initialHour');
    const im = localStorage.getItem('pln_initialMinutes');
    const th = localStorage.getItem('pln_targetHour');
    const tm = localStorage.getItem('pln_targetMinutes');
    const ns = localStorage.getItem('pln_numShifts');
    const sn = localStorage.getItem('pln_shiftNames');
    if (ih !== null && im !== null && th !== null && tm !== null && ns !== null) {
        initialHour = parseInt(ih);
        initialMinutes = parseInt(im);
        targetHour = parseInt(th);
        targetMinutes = parseInt(tm);
        numShifts = parseInt(ns);
        referenceTime = createDate(initialHour, initialMinutes);
    }
    if (sn) {
        try { shiftNames = JSON.parse(sn); } catch { shiftNames = Array(numShifts).fill(""); }
    } else {
        shiftNames = Array(numShifts).fill("");
    }
}

// --- Button handlers ---
document.getElementById('inc-shift').onclick = () => { if (numShifts < 10) { numShifts++; saveState(); updateUI(); } };
document.getElementById('dec-shift').onclick = () => { if (numShifts > 1) { numShifts--; saveState(); updateUI(); } };
document.getElementById('inc-target').onclick = () => {
    if (targetHour < MAX_TARGET || (targetHour === MAX_TARGET && targetMinutes < 45)) {
        if (targetMinutes === 45) { targetMinutes = 0; targetHour++; }
        else targetMinutes += 15;
        saveState();
        updateUI();
    }
};
document.getElementById('dec-target').onclick = () => {
    if (targetHour > MIN_TARGET || (targetHour === MIN_TARGET && targetMinutes > 0)) {
        if (targetMinutes === 0) { targetMinutes = 45; targetHour--; }
        else targetMinutes -= 15;
        saveState();
        updateUI();
    }
};
document.getElementById('inc-initial').onclick = () => {
    // Always round up to the next quarter hour
    let totalMinutes = initialHour * 60 + initialMinutes;
    let nextQuarter = Math.ceil((totalMinutes + 1) / 15) * 15;
    if (nextQuarter >= 24 * 60) nextQuarter = 0;
    initialHour = Math.floor(nextQuarter / 60);
    initialMinutes = nextQuarter % 60;
    referenceTime = createDate(initialHour, initialMinutes);
    saveState();
    updateUI();
};
document.getElementById('dec-initial').onclick = () => {
    // Always round down to the previous quarter hour
    let totalMinutes = initialHour * 60 + initialMinutes;
    let prevQuarter = Math.floor((totalMinutes - 1) / 15) * 15;
    if (prevQuarter < 0) prevQuarter = 24 * 60 - 15;
    initialHour = Math.floor(prevQuarter / 60);
    initialMinutes = prevQuarter % 60;
    referenceTime = createDate(initialHour, initialMinutes);
    saveState();
    updateUI();
};
document.getElementById('now').onclick = () => {
    const now = new Date();
    initialHour = now.getHours();
    initialMinutes = now.getMinutes();
    referenceTime = createDate(initialHour, initialMinutes);
    saveState();
    updateUI();
};
document.getElementById('recalc').onclick = () => {
    referenceTime = createDate(initialHour, initialMinutes);
    saveState();
    updateUI();
};
// --- Init ---
loadState();
updateUI();
let markerInterval;
function startMarkerInterval() {
    if (markerInterval) clearInterval(markerInterval);
    markerInterval = setInterval(() => {
        updateMarker();
    }, 1000);
}
startMarkerInterval();

// --- Shift names ---
function openNamesModal() {
    const modal = document.getElementById('names-modal');
    const form = document.getElementById('names-form');
    form.innerHTML = '';
    for (let i = 0; i < numShifts; i++) {
        form.innerHTML += `<div style='margin-bottom:10px;'><label style='font-weight:500;color:#00796b;'>Turno ${i+1}:</label> <input type='text' style='padding:4px 8px;border-radius:6px;border:1px solid #b2dfdb;width:60%;' value='${shiftNames[i] || ''}' data-shift='${i}' /></div>`;
    }
    modal.style.display = 'flex';
}
document.getElementById('names-btn').onclick = openNamesModal;
document.getElementById('names-cancel').onclick = () => {
    document.getElementById('names-modal').style.display = 'none';
};
document.getElementById('names-save').onclick = () => {
    const inputs = document.querySelectorAll('#names-form input');
    shiftNames = Array.from(inputs).map(input => input.value.trim());
    document.getElementById('names-modal').style.display = 'none';
    saveState();
    updateUI();
};
document.getElementById('names-clear').onclick = () => {
    shiftNames = Array(numShifts).fill("");
    document.getElementById('names-modal').style.display = 'none';
    saveState();
    updateUI();
};
// Fix modal display: ensure modal is in the DOM and event listeners are attached after DOM is loaded
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('names-btn').onclick = openNamesModal;
  document.getElementById('names-cancel').onclick = () => {
      document.getElementById('names-modal').style.display = 'none';
  };
  document.getElementById('names-save').onclick = () => {
      const inputs = document.querySelectorAll('#names-form input');
      shiftNames = Array.from(inputs).map(input => input.value.trim());
      document.getElementById('names-modal').style.display = 'none';
      saveState();
      updateUI();
  };
  document.getElementById('names-clear').onclick = () => {
      shiftNames = Array(numShifts).fill("");
      document.getElementById('names-modal').style.display = 'none';
      saveState();
      updateUI();
  };
});
</script>
</body>
</html>
